<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17181a">
  <meta name="description" content="אפליקציית משימות אישית פשוטה ומהירה">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>המשימות שלי</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17181a;font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}
    .app{min-height:100%;padding:20px}.wrap{max-width:900px;margin:0 auto}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}h1{font-size:30px;margin:0 0 4px;font-weight:800}.sub{margin:0;color:#696b70;font-size:14px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat,.panel,.task{background:#fff;border:1px solid #e3e4e7}.stat{padding:9px 12px;border-radius:12px;font-size:13px}.panel{border-radius:16px;padding:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}input,select{width:100%;min-height:44px;border:1px solid #d7d8dc;border-radius:10px;padding:9px 11px;background:#fff;color:inherit;font-size:16px}button{min-height:44px;border:0;border-radius:10px;padding:9px 14px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:#17181a;color:#fff;width:100%;margin-top:12px}.filters,.actions{display:flex;gap:8px;flex-wrap:wrap}.filter,.secondary{background:#eceef1;color:inherit}.filter.active{outline:2px solid #17181a}.actions{margin-top:12px}.actions button{flex:1;min-width:140px}.list{display:grid;gap:10px}.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border-radius:14px;padding:13px}.check{width:24px;height:24px;accent-color:#17181a}.taskTitle{font-weight:800;font-size:16px;overflow-wrap:anywhere}.task.done .taskTitle{text-decoration:line-through;opacity:.55}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px;color:#666a70;font-size:12px}.badge{border:1px solid #dedfe3;border-radius:999px;padding:3px 7px}.danger{background:transparent;color:inherit;border:1px solid #dadce0;min-height:38px;padding:6px 10px}.empty{text-align:center;padding:34px 16px;color:#777b82}.overdue{font-weight:800;color:#9d2b2b}.validation{min-height:20px;margin-top:8px;font-size:13px;color:#9d2b2b}.categoryTools{display:flex;gap:8px;align-items:end}.categoryTools select{flex:1}.newCategoryBox{display:none;margin-top:10px;grid-template-columns:1fr auto;gap:8px}.newCategoryBox.show{display:grid}.inlineList{display:none;margin-top:12px;background:#fff;border:1px solid #e3e4e7;border-radius:14px;padding:14px}.inlineList.show{display:block}.inlineList pre{margin:0;white-space:pre-wrap;font-family:inherit;line-height:1.7}.printList{display:none}.installHint{font-size:13px;color:#666a70;margin-top:10px;line-height:1.5}
    @media(max-width:700px){.app{padding:14px}.grid{grid-template-columns:1fr 1fr}.grid .wide{grid-column:1/-1}h1{font-size:26px}}
    @media(max-width:430px){.grid{grid-template-columns:1fr}.grid .wide{grid-column:auto}.task{grid-template-columns:auto 1fr}.task .danger{grid-column:2;justify-self:start}}
    @media(prefers-color-scheme:dark){body{background:#141517;color:#f4f4f5}.stat,.panel,.task,.inlineList{background:#202226;border-color:#33363c}input,select{background:#17191c;border-color:#444850;color:#f4f4f5}.filter,.secondary{background:#2b2e33}.filter.active{outline-color:#f1f1f2}.badge{border-color:#3d4148}.danger{border-color:#454951}.sub,.meta,.installHint{color:#a7abb2}.primary{background:#f1f1f2;color:#17181a}.overdue,.validation{color:#ff9c9c}}
    @media print{body *{visibility:hidden!important}.app,.app *{visibility:visible!important}.app{position:absolute;inset:0;background:#fff!important;color:#000!important;padding:0!important}.top,#taskForm,.panel,#taskList{display:none!important}.printList{display:block!important}.printList h2{font-size:24px;margin:0 0 16px}.printList table{width:100%;border-collapse:collapse}.printList th,.printList td{border:1px solid #999;padding:8px;text-align:right}}
  </style>
</head>
<body>
<div class="app" id="personalTasksApp">
  <div class="wrap">
    <div class="top"><div><h1>המשימות שלי</h1><p class="sub">פשוט, אישי ומהיר</p></div><div class="stats"><span class="stat">פתוחות: <strong id="openCount">0</strong></span><span class="stat">הושלמו: <strong id="doneCount">0</strong></span></div></div>
    <form id="taskForm" class="panel">
      <div class="grid">
        <div class="wide"><label for="taskTitle">מה צריך לעשות?</label><input id="taskTitle" maxlength="120" placeholder="לדוגמה: להתקשר לביטוח" autocomplete="off"></div>
        <div><label for="taskDate">תאריך יעד</label><input id="taskDate" type="date"></div>
        <div><label for="taskCategory">קטגוריה</label><div class="categoryTools"><select id="taskCategory"></select><button id="showCategoryForm" class="secondary" type="button">＋ קטגוריה</button></div><div id="newCategoryBox" class="newCategoryBox"><input id="newCategoryName" maxlength="40" placeholder="שם קטגוריה חדשה" autocomplete="off"><button id="addCategory" class="secondary" type="button">הוסף</button></div></div>
        <div><label for="taskPriority">עדיפות</label><select id="taskPriority"><option value="רגילה">רגילה</option><option value="גבוהה">גבוהה</option><option value="דחופה">דחופה</option></select></div>
      </div>
      <button class="primary" type="submit">＋ הוסף משימה</button><div id="validation" class="validation" aria-live="polite"></div>
    </form>
    <div class="panel">
      <div class="filters" aria-label="סינון משימות"><button type="button" class="filter active" data-filter="open">פתוחות</button><button type="button" class="filter" data-filter="today">היום</button><button type="button" class="filter" data-filter="all">הכול</button><button type="button" class="filter" data-filter="done">הושלמו</button></div>
      <div class="actions"><button id="showList" type="button" class="secondary">☷ הצג כרשימה</button><button id="emailList" type="button" class="secondary">✉ שלח במייל</button><button id="printListBtn" type="button" class="secondary">🖨 הדפסה</button></div>
      <div id="installHint" class="installHint">לאחר הפרסום, פתח ב‑Chrome ובחר ⋮ ← התקנת אפליקציה / הוספה למסך הבית.</div>
      <div id="inlineList" class="inlineList" aria-live="polite"><pre id="inlineListText"></pre></div>
    </div>
    <div id="taskList" class="list" aria-live="polite"></div><div id="printList" class="printList"></div>
  </div>
</div>
<script>
(()=>{
  const root=document.getElementById('personalTasksApp'),form=document.getElementById('taskForm'),title=document.getElementById('taskTitle'),date=document.getElementById('taskDate'),category=document.getElementById('taskCategory'),showCategoryForm=document.getElementById('showCategoryForm'),newCategoryBox=document.getElementById('newCategoryBox'),newCategoryName=document.getElementById('newCategoryName'),addCategory=document.getElementById('addCategory'),priority=document.getElementById('taskPriority'),list=document.getElementById('taskList'),validation=document.getElementById('validation'),openCount=document.getElementById('openCount'),doneCount=document.getElementById('doneCount'),showList=document.getElementById('showList'),emailList=document.getElementById('emailList'),printListBtn=document.getElementById('printListBtn'),printList=document.getElementById('printList'),inlineList=document.getElementById('inlineList'),inlineListText=document.getElementById('inlineListText');
  let filter='open'; const storageKey='personalTasksAppDataV1'; let nextId=1;
  const todayISO=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}; date.value=todayISO();
  const defaultCategories=['אישי','עבודה','בית','טלפונים','סידורים','כספים']; let tasks=[]; let categories=[...defaultCategories];
  const saveData=()=>{try{localStorage.setItem(storageKey,JSON.stringify({tasks,categories,nextId}))}catch(e){}};
  const loadData=()=>{try{const raw=localStorage.getItem(storageKey);if(!raw)return;const saved=JSON.parse(raw);if(Array.isArray(saved.tasks))tasks=saved.tasks;if(Array.isArray(saved.categories)&&saved.categories.length)categories=saved.categories;if(Number.isInteger(saved.nextId)&&saved.nextId>0)nextId=saved.nextId;else nextId=Math.max(1,...tasks.map(t=>Number(t.id)||0))+1}catch(e){}};
  const syncCategories=()=>{const selected=category.value;category.innerHTML='';categories.forEach(name=>{const o=document.createElement('option');o.value=name;o.textContent=name;category.appendChild(o)});if(categories.includes(selected))category.value=selected}; loadData();syncCategories();
  const fmtDate=iso=>{if(!iso)return 'ללא תאריך';const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`}; const visible=t=>filter==='open'?!t.done:filter==='done'?t.done:filter==='today'?!t.done&&t.date===todayISO():true; const currentTasks=()=>tasks.filter(visible).sort((a,b)=>Number(a.done)-Number(b.done)||(a.date||'9999-99-99').localeCompare(b.date||'9999-99-99')); const taskStatus=t=>t.done?'הושלם':'פתוח';
  const buildPlainList=()=>{const shown=currentTasks();if(!shown.length)return 'אין משימות להצגה.';return shown.map((t,i)=>`${i+1}. ${t.title}\n   תאריך: ${fmtDate(t.date)} | קטגוריה: ${t.category} | עדיפות: ${t.priority} | סטטוס: ${taskStatus(t)}`).join('\n\n')};
  const buildPrintList=()=>{const shown=currentTasks(),heading=document.createElement('h2'),table=document.createElement('table'),thead=document.createElement('thead'),tbody=document.createElement('tbody');heading.textContent='רשימת המשימות שלי';thead.innerHTML='<tr><th>#</th><th>משימה</th><th>תאריך</th><th>קטגוריה</th><th>עדיפות</th><th>סטטוס</th></tr>';shown.forEach((t,i)=>{const tr=document.createElement('tr');[i+1,t.title,fmtDate(t.date),t.category,t.priority,taskStatus(t)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tbody.appendChild(tr)});table.append(thead,tbody);printList.innerHTML='';printList.append(heading,table)};
  function render(){openCount.textContent=tasks.filter(t=>!t.done).length;doneCount.textContent=tasks.filter(t=>t.done).length;const shown=currentTasks();list.innerHTML='';if(!shown.length){const e=document.createElement('div');e.className='empty panel';e.textContent='אין משימות להצגה כאן.';list.appendChild(e);return}shown.forEach(t=>{const row=document.createElement('div');row.className='task'+(t.done?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.className='check';cb.checked=t.done;cb.setAttribute('aria-label','סמן משימה כבוצעה');cb.addEventListener('change',()=>{t.done=cb.checked;saveData();render()});const body=document.createElement('div'),tt=document.createElement('div'),meta=document.createElement('div'),due=document.createElement('span'),cat=document.createElement('span'),pri=document.createElement('span');tt.className='taskTitle';tt.textContent=t.title;meta.className='meta';due.className='badge';due.textContent=fmtDate(t.date);if(t.date&&!t.done&&t.date<todayISO())due.classList.add('overdue');cat.className='badge';cat.textContent=t.category;pri.className='badge';pri.textContent=t.priority;meta.append(due,cat,pri);body.append(tt,meta);const del=document.createElement('button');del.type='button';del.className='danger';del.textContent='מחק';del.addEventListener('click',()=>{tasks=tasks.filter(x=>x.id!==t.id);saveData();render()});row.append(cb,body,del);list.appendChild(row)})}
  form.addEventListener('submit',e=>{e.preventDefault();validation.textContent='';const value=title.value.trim();if(!value){validation.textContent='יש לרשום את המשימה.';title.focus();return}tasks.unshift({id:nextId++,title:value,date:date.value,category:category.value,priority:priority.value,done:false});saveData();title.value='';priority.value='רגילה';title.focus();render()});
  showCategoryForm.addEventListener('click',()=>{newCategoryBox.classList.toggle('show');if(newCategoryBox.classList.contains('show'))newCategoryName.focus()}); addCategory.addEventListener('click',()=>{validation.textContent='';const value=newCategoryName.value.trim();if(!value){validation.textContent='יש לרשום שם לקטגוריה.';newCategoryName.focus();return}const exists=categories.some(n=>n.toLowerCase()===value.toLowerCase());if(exists){validation.textContent='הקטגוריה כבר קיימת.';category.value=categories.find(n=>n.toLowerCase()===value.toLowerCase());return}categories.push(value);syncCategories();category.value=value;saveData();newCategoryName.value='';newCategoryBox.classList.remove('show')}); newCategoryName.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addCategory.click()}});
  showList.addEventListener('click',()=>{inlineListText.textContent=buildPlainList();inlineList.classList.toggle('show');showList.textContent=inlineList.classList.contains('show')?'✕ הסתר רשימה':'☷ הצג כרשימה'});
  emailList.addEventListener('click',()=>{const body=buildPlainList();const url='mailto:?subject='+encodeURIComponent('רשימת המשימות שלי')+'&body='+encodeURIComponent(body);window.location.href=url;setTimeout(()=>{inlineListText.textContent='אם אפליקציית המייל לא נפתחה, אפשר להעתיק מכאן:\n\n'+body;inlineList.classList.add('show');showList.textContent='✕ הסתר רשימה'},500)});
  printListBtn.addEventListener('click',()=>{buildPrintList();window.print()});
  root.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{filter=btn.dataset.filter;root.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===btn));render()})); render();
  if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
})();
</script>
</body>
</html>
